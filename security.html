<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Bảo vệ cổng — Wahl Vietnam</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/logo-placeholder.png">
</head>
<body class="page-security">

<header class="app-header">
  <div class="brand">
    <div class="brand__logo" aria-hidden="true">W</div>
    <div class="brand__text">
      <span class="brand__name">Wahl Vietnam</span>
      <span class="brand__title">Bảo vệ cổng</span>
    </div>
  </div>
  <div class="header-actions">
    <span class="live-dot" id="live-status">Đang tải…</span>
    <button type="button" class="btn btn-secondary btn-sm" id="btn-refresh">Làm mới</button>
  </div>
</header>

<main class="app-main">

  <div class="page-head row row--between">
    <div>
      <h1 id="page-title">Giấy phép hôm nay</h1>
      <p>Xem nhanh ai đã được duyệt ra cổng. Tự cập nhật mỗi 15 giây.</p>
    </div>
    <label class="field" style="width:170px">
      <span class="field__label">Ngày</span>
      <input type="date" id="f-day">
    </label>
  </div>

  <div class="stats" id="stats">
    <button type="button" class="stat stat--ok" data-filter="ok"><div class="stat__n" id="n-ok">–</div><div class="stat__label">Được ra cổng</div></button>
    <button type="button" class="stat stat--wait" data-filter="wait"><div class="stat__n" id="n-wait">–</div><div class="stat__label">Chưa duyệt xong</div></button>
    <button type="button" class="stat stat--no" data-filter="no"><div class="stat__n" id="n-no">–</div><div class="stat__label">Bị từ chối</div></button>
    <button type="button" class="stat active" data-filter="all"><div class="stat__n" id="n-all">–</div><div class="stat__label">Tất cả</div></button>
  </div>

  <div class="toolbar">
    <label class="field field--grow">
      <span class="sr-only">Tìm kiếm</span>
      <input type="search" id="search-box" class="search-input" placeholder="Tìm theo tên, mã NV, bộ phận hoặc mã giấy phép" autocomplete="off" spellcheck="false">
    </label>
  </div>

  <div id="request-list" class="pass-list" aria-live="polite">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
  <div id="empty-state" class="empty-state hidden">
    <div class="empty-state__icon">🗒️</div>
    <div id="empty-text">Chưa có giấy phép nào cho ngày này</div>
  </div>
  <div class="alert alert-danger hidden" id="load-error" role="alert"></div>

</main>

<footer class="app-footer">Chỉ hiển thị — không cần đăng nhập. Mọi thay đổi do Giám sát / Trưởng bộ phận / HR thực hiện.</footer>

<script src="assets/js/config.js"></script>
<script type="module">
  import { initSecurityPage } from './assets/js/page-security.js';
  initSecurityPage();
</script>

</body>
</html>
